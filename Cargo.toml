[package]
name = "sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]
memchr = "2.7"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
