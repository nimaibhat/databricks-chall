name: bench
on:
  push:
    branches: [bench]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: machine
        run: |
          lscpu | head -20; nproc; free -g
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
          df -hT . /tmp; uname -a; docker version --format '{{.Server.Version}}'
      - name: generator
        run: |
          mkdir -p ~/gen && cd ~/gen
          curl -sSfL -o generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip
          d=$(dirname $(find . -name Cargo.toml | head -1)); cd $d && cargo build --release -q
          time ./target/release/generate --seed 7 --events ${EVENTS:-20000000} --clicks ${CLICKS:-5000000} --output ~/data
          du -sh ~/data
      - name: x86 gate tests
        run: |
          git fetch -q origin "refs/heads/gate-*:refs/remotes/origin/gate-*" || true
          ref=$(grep -v '^#' bench/variants.txt | tail -1 | cut -d'|' -f2)
          rm -rf /tmp/t && git worktree add -f /tmp/t "$ref" -q && cd /tmp/t
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test --release 2>&1 | grep -E "^test |test result"
      - name: bench
        run: |
          git fetch -q origin "refs/heads/gate-*:refs/remotes/origin/gate-*" || true
          bash bench/gha_bench.sh
      - name: scenarios
        run: bash bench/scen.sh
